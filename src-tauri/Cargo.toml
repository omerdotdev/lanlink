[package]
name = "lanlink"
version = "1.0.0"
description = "Share files with devices on your local network"
authors = ["Lanlink contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "lanlink_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
mdns-sd = "0.13"
local-ip-address = "0.6"
hostname = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
qrcode = "0.14"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
dirs = "6"
sanitize-filename = "0.6"
tempfile = "3"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
